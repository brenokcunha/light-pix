# Tempo 3 em modo monolítico (target "all"): block-builder, live-store e
# backend scheduler/worker no mesmo processo, sem Kafka.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Compactação e retenção são jobs do backend worker no Tempo 3.
backend_worker:
  compaction:
    block_retention: 72h

# Gera service graph e métricas RED a partir dos spans e envia ao Prometheus
# (alimenta o mapa de serviços no Grafana).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
