global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Métricas OTLP chegam via Collector. Atributos de resource promovidos a label
# precisam ter baixa cardinalidade (nunca EndToEndId, conta ou CPF).
otlp:
  promote_resource_attributes:
    - service.version
    - deployment.environment.name
    - psp.ispb
    - psp.name

storage:
  tsdb:
    # Pushes OTLP podem chegar fora de ordem.
    out_of_order_time_window: 30m

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: [localhost:9090] }]
  - job_name: otel-collector
    static_configs: [{ targets: [otel-collector:8888] }]
  - job_name: rabbitmq
    static_configs: [{ targets: [rabbitmq:15692] }]
  - job_name: mongodb
    static_configs: [{ targets: [mongodb-exporter:9216] }]
  - job_name: cadvisor
    static_configs: [{ targets: [cadvisor:8080] }]
  - job_name: tempo
    static_configs: [{ targets: [tempo:3200] }]
  - job_name: loki
    static_configs: [{ targets: [loki:3100] }]
  - job_name: alloy
    static_configs: [{ targets: [alloy:12345] }]
  - job_name: alertmanager
    static_configs: [{ targets: [alertmanager:9093] }]
  - job_name: grafana
    static_configs: [{ targets: [grafana:3000] }]
