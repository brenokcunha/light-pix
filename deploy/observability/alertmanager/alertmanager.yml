# Sem integração externa no laboratório: os alertas ficam visíveis na UI do
# Alertmanager e no Grafana. Para notificar, adicione um receiver (webhook,
# Slack...) ao "default".
route:
  receiver: default
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
