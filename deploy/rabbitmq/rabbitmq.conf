# vhosts e usuário do laboratório; filas e exchanges são declaradas pelos serviços.
load_definitions = /etc/rabbitmq/definitions.json

# Métricas por fila (profundidade, consumidores, taxas). Com poucas filas a
# cardinalidade é baixa; em produção, prefira o endpoint /metrics/detailed.
prometheus.return_per_object_metrics = true

# Quorum queues são o padrão do laboratório.
default_queue_type = quorum
